services:
#fastapi
  fastapi:
    build:
      context: ..
      dockerfile: Docker/minirag/Dockerfile
    container_name: fastapi


    volumes:
      - "fastapi_data:/app/assets"


    depends_on:
      pgvector:
        condition: service_healthy

    env_file:
      - ./envs/.env.app


    networks:
      - backend
    
    restart: always




#Nginx
  nginx:
    image: nginx:1.30
    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - "./nginx/deafult_conf:/etc/nginx/conf.d/default.conf:ro"
      - "../frontend:/usr/share/nginx/html:ro"

    depends_on:
      - fastapi

    networks:
      - backend

    restart: always



#grafana

  grafana:
    image: grafana/grafana:12.3.11
    container_name: grafana

    volumes:
      - "grafana-storage:/var/lib/grafana"

    env_file:
      - ./envs/.env.grafana


    networks:
      - backend

    restart: always






#prometheus
  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: prometheus



    volumes:
      - "prometheus:/prometheus"
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"

    networks: 
      - backend

    restart: always

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'






#node exporter
  node-exporter:
    image: rancher/prom-node-exporter:v1.3.1
    container_name: node-exporter

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

    networks:
      - backend

    restart: always







#qdrant
  qdrant:
    image: qdrant/qdrant:v1.19
    container_name: qdrant

    volumes:
      - "qdrant:/qdrant/storage"

    networks:
      - backend

    restart: always


  ollama:
    image: ollama/ollama:latest
    container_name: ollama


    volumes:
      - ollama_data:/root/.ollama

    networks:
      - backend

    restart: always





  pgvector:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: pgvector

    volumes:
      - 'pgvector:/var/lib/postgresql'


    env_file:
      - ./envs/.env.postgres

    networks:
      - backend

    restart: always

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youssefrifat -d mini_rag"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s



  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter


    depends_on:
      pgvector:
        condition: service_healthy

    env_file:
      - ./envs/.env.postgres_exporter

    networks:
      - backend

    restart: always

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    container_name: rabbitmq


    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

    env_file:
      - ./envs/.env.rabbitmq

    restart: unless-stopped

    networks:
      - backend

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s


  
  redis:
    image: redis:8.8.2
    container_name: redis

    volumes:
      - redis_data:/data

    networks:
      - backend

    env_file:
      - ./envs/.env.redis
    
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  celery-worker:
    build:
      context: ..
      dockerfile: Docker/minirag/Dockerfile

    container_name: celery-worker

    command: >
      celery -A celeryapp:celery_app
      worker
      --loglevel=info
      --hostname=worker1@%h
      --events
      --queues=default,file_processing,indexing_data

    env_file:
      - ./envs/.env.app

    volumes:
      - "fastapi_data:/app/assets"

    depends_on:
      rabbitmq:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - backend

    restart: always

  flower:
    build:
      context: ..
      dockerfile: Docker/minirag/Dockerfile

    container_name: flower

    command: >
      celery -A celeryapp:celery_app
      flower
      --port=5555
      
    env_file:
      - ./envs/.env.app

    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - backend

    restart: always

    

networks:
  backend:
    driver: bridge



  

volumes:
  fastapi_data:
  pgvector:
  qdrant:
  prometheus:
  grafana-storage:
  ollama_data:
  rabbitmq_data:
  redis_data:




